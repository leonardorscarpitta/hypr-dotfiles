$ink    = rgb(131318)
$text   = rgb(e5e1e9)
$muted  = rgb(86838d)
$gold   = rgb(c4c0ff)
$gold2  = rgb(e2dfff)
$clay   = rgb(ffb4ab)
$font   = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/kintsugi.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $gold2
    font_size = 108
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(e2dfffff) rgba(c4c0ffff) rgba(ffb4abcc) 135deg
    inner_color = rgba(131318cc)
    font_color = $text
    font_family = $font
    check_color = $gold
    fail_color = $clay
    fail_text = <i>the seam did not hold ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##86838d">󰍁  mend with password…</span>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀄  $USER
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}

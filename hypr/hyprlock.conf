$ink    = rgb(141318)
$text   = rgb(e9e2d4)
$muted  = rgb(8b8496)
$gold   = rgb(d6aa5c)
$gold2  = rgb(f1d08f)
$clay   = rgb(cf6a52)
$font   = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/kintsugi.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $gold2
    font_size = 108
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(f1d08fff) rgba(d6aa5cff) rgba(cf6a52cc) 135deg
    inner_color = rgba(141318cc)
    font_color = $text
    font_family = $font
    check_color = $gold
    fail_color = $clay
    fail_text = <i>the seam did not hold ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##8b8496">󰍁  mend with password…</span>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀄  $USER
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}

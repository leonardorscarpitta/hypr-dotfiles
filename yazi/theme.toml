[mgr]
cwd = { fg = "#f1d08f", bold = true }

find_keyword  = { fg = "#f1d08f", bold = true, underline = true }
find_position = { fg = "#a98bbf", bg = "reset", italic = true }

marker_copied   = { fg = "#93b088", bg = "#93b088" }
marker_cut      = { fg = "#cf6a52", bg = "#cf6a52" }
marker_marked   = { fg = "#73a7a3", bg = "#73a7a3" }
marker_selected = { fg = "#d6aa5c", bg = "#d6aa5c" }

count_copied   = { fg = "#141318", bg = "#93b088" }
count_cut      = { fg = "#141318", bg = "#cf6a52" }
count_selected = { fg = "#141318", bg = "#d6aa5c" }

border_style = { fg = "#46414f" }

[indicator]

parent  = { bg = "#2a2731" }
current = { bg = "#2a2731", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "#141318", bg = "#d6aa5c", bold = true }
inactive = { fg = "#8b8496", bg = "#1e1c23" }

[mode]
normal_main = { fg = "#141318", bg = "#d6aa5c", bold = true }
normal_alt  = { fg = "#d6aa5c", bg = "#1e1c23" }
select_main = { fg = "#141318", bg = "#73a7a3", bold = true }
select_alt  = { fg = "#73a7a3", bg = "#1e1c23" }
unset_main  = { fg = "#141318", bg = "#cf6a52", bold = true }
unset_alt   = { fg = "#cf6a52", bg = "#1e1c23" }

[status]
perm_sep   = { fg = "#46414f" }
perm_type  = { fg = "#84a0cc" }
perm_read  = { fg = "#d6aa5c" }
perm_write = { fg = "#cf6a52" }
perm_exec  = { fg = "#93b088" }
progress_label  = { fg = "#e9e2d4", bold = true }
progress_normal = { fg = "#d6aa5c", bg = "#1e1c23" }
progress_error  = { fg = "#cf6a52", bg = "#1e1c23" }

[which]
border          = { fg = "#46414f" }
cand            = { fg = "#f1d08f" }
rest            = { fg = "#8b8496" }
desc            = { fg = "#c9c1b3" }
separator_style = { fg = "#46414f" }

[confirm]
border  = { fg = "#d6aa5c" }
title   = { fg = "#f1d08f" }
btn_yes = { fg = "#141318", bg = "#d6aa5c" }

[spot]
border   = { fg = "#46414f" }
title    = { fg = "#f1d08f" }
tbl_col  = { fg = "#d6aa5c" }
tbl_cell = { fg = "#141318", bg = "#d6aa5c" }

[notify]
title_info  = { fg = "#93b088" }
title_warn  = { fg = "#d6aa5c" }
title_error = { fg = "#cf6a52" }

[pick]
border = { fg = "#46414f" }
active = { fg = "#f1d08f", bold = true }

[input]
border   = { fg = "#d6aa5c" }
title    = { fg = "#f1d08f" }
selected = { bg = "#2a2731" }

[cmp]
border = { fg = "#46414f" }
active = { bg = "#2a2731", fg = "#f1d08f" }

[tasks]
border  = { fg = "#46414f" }
title   = { fg = "#f1d08f" }
hovered = { fg = "#f1d08f", bold = true }

[help]
border  = { fg = "#46414f" }
chord   = { fg = "#d6aa5c" }
hovered = { bg = "#2a2731", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#d6aa5c" },
	{ mime = "**/{audio,video}/*", fg = "#a98bbf" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cf6a52" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#73a7a3" },
	{ mime = "vfs/{absent,stale}", fg = "#46414f" },
	{ url = "*", is = "orphan", fg = "#cf6a52", italic = true },
	{ url = "*", is = "exec", fg = "#93b088" },
	{ url = "*", is = "dummy", fg = "#cf6a52", italic = true },
	{ url = "*/", is = "dummy", fg = "#cf6a52", italic = true },
	{ url = "*/", fg = "#84a0cc" },
	{ url = "*", fg = "#e9e2d4" },
]

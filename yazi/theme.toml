[mgr]
cwd = { fg = "#e2dfff", bold = true }

find_keyword  = { fg = "#e2dfff", bold = true, underline = true }
find_position = { fg = "#d0b4f0", bg = "reset", italic = true }

marker_copied   = { fg = "#7aba7d", bg = "#7aba7d" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#49c1d3", bg = "#49c1d3" }
marker_selected = { fg = "#c4c0ff", bg = "#c4c0ff" }

count_copied   = { fg = "#131318", bg = "#7aba7d" }
count_cut      = { fg = "#131318", bg = "#ffb4ab" }
count_selected = { fg = "#131318", bg = "#c4c0ff" }

border_style = { fg = "#46454f" }

[indicator]

parent  = { bg = "#312f4f" }
current = { bg = "#312f4f", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "#131318", bg = "#c4c0ff", bold = true }
inactive = { fg = "#86838d", bg = "#1f1e25" }

[mode]
normal_main = { fg = "#131318", bg = "#c4c0ff", bold = true }
normal_alt  = { fg = "#c4c0ff", bg = "#1f1e25" }
select_main = { fg = "#131318", bg = "#49c1d3", bold = true }
select_alt  = { fg = "#49c1d3", bg = "#1f1e25" }
unset_main  = { fg = "#131318", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#1f1e25" }

[status]
perm_sep   = { fg = "#46454f" }
perm_type  = { fg = "#9fb2f5" }
perm_read  = { fg = "#c4c0ff" }
perm_write = { fg = "#ffb4ab" }
perm_exec  = { fg = "#7aba7d" }
progress_label  = { fg = "#e5e1e9", bold = true }
progress_normal = { fg = "#c4c0ff", bg = "#1f1e25" }
progress_error  = { fg = "#ffb4ab", bg = "#1f1e25" }

[which]
border          = { fg = "#46454f" }
cand            = { fg = "#e2dfff" }
rest            = { fg = "#86838d" }
desc            = { fg = "#c8c5d0" }
separator_style = { fg = "#46454f" }

[confirm]
border  = { fg = "#c4c0ff" }
title   = { fg = "#e2dfff" }
btn_yes = { fg = "#131318", bg = "#c4c0ff" }

[spot]
border   = { fg = "#46454f" }
title    = { fg = "#e2dfff" }
tbl_col  = { fg = "#c4c0ff" }
tbl_cell = { fg = "#131318", bg = "#c4c0ff" }

[notify]
title_info  = { fg = "#7aba7d" }
title_warn  = { fg = "#c4c0ff" }
title_error = { fg = "#ffb4ab" }

[pick]
border = { fg = "#46454f" }
active = { fg = "#e2dfff", bold = true }

[input]
border   = { fg = "#c4c0ff" }
title    = { fg = "#e2dfff" }
selected = { bg = "#312f4f" }

[cmp]
border = { fg = "#46454f" }
active = { bg = "#312f4f", fg = "#e2dfff" }

[tasks]
border  = { fg = "#46454f" }
title   = { fg = "#e2dfff" }
hovered = { fg = "#e2dfff", bold = true }

[help]
border  = { fg = "#46454f" }
chord   = { fg = "#c4c0ff" }
hovered = { bg = "#312f4f", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#c4c0ff" },
	{ mime = "**/{audio,video}/*", fg = "#d0b4f0" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#49c1d3" },
	{ mime = "vfs/{absent,stale}", fg = "#46454f" },
	{ url = "*", is = "orphan", fg = "#ffb4ab", italic = true },
	{ url = "*", is = "exec", fg = "#7aba7d" },
	{ url = "*", is = "dummy", fg = "#ffb4ab", italic = true },
	{ url = "*/", is = "dummy", fg = "#ffb4ab", italic = true },
	{ url = "*/", fg = "#9fb2f5" },
	{ url = "*", fg = "#e5e1e9" },
]

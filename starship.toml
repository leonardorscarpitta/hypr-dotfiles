palette = "kintsugi"
add_newline = true
format = """
[╭─](overlay)$directory$git_branch$git_status$cmd_duration
[╰─](overlay)$character"""

[palettes.kintsugi]
ink = "#131318"
overlay = "#46454f"
muted = "#86838d"
text = "#e5e1e9"
gold = "#c4c0ff"
gold2 = "#e2dfff"
clay = "#ffb4ab"
sage = "#7aba7d"
teal = "#49c1d3"

[directory]
style = "bold gold2"
format = "[ $path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "teal"
format = "[on](muted) [$symbol$branch]($style) "

[git_status]
style = "clay"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 1500
style = "muted"
format = "[took $duration]($style)"

[character]
success_symbol = "[◆](bold gold)"
error_symbol = "[◆](bold clay)"
vimcmd_symbol = "[◇](bold sage)"

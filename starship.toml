palette = "kintsugi"
add_newline = true
format = """
[╭─](overlay)$directory$git_branch$git_status$cmd_duration
[╰─](overlay)$character"""

[palettes.kintsugi]
ink = "#141318"
overlay = "#46414f"
muted = "#8b8496"
text = "#e9e2d4"
gold = "#d6aa5c"
gold2 = "#f1d08f"
clay = "#cf6a52"
sage = "#93b088"
teal = "#73a7a3"

[directory]
style = "bold gold2"
format = "[ $path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "teal"
format = "[on](muted) [$symbol$branch]($style) "

[git_status]
style = "clay"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 1500
style = "muted"
format = "[took $duration]($style)"

[character]
success_symbol = "[◆](bold gold)"
error_symbol = "[◆](bold clay)"
vimcmd_symbol = "[◇](bold sage)"
